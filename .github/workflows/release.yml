name: Release

# Publishes to PyPI when a GitHub release is published, using PyPI Trusted
# Publishing (OIDC): no API token is stored anywhere.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::release tag $TAG does not match pyproject version $version"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/env
          /tmp/env/bin/pip install dist/*.whl
          /tmp/env/bin/noisefloor --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/noisefloor-evals/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

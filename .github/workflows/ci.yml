name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m "not slow"

  validation:
    name: statistical validation (Monte Carlo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m slow

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/noisefloor --version
          /tmp/wheel-env/bin/noisefloor compare examples/data/rag_baseline.jsonl examples/data/rag_candidate.jsonl

  action:
    name: dogfood the GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Noisy improvement should pass the default gate
        id: noisy
        uses: ./
        with:
          baseline: examples/data/rag_baseline.jsonl
          candidate: examples/data/rag_candidate.jsonl
          comment: "false"
      - name: Real regression should fail the gate
        id: regression
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/data/suite/main/long_context.jsonl
          candidate: examples/data/suite/pr/long_context.jsonl
          comment: "false"
      - name: Check outcomes
        env:
          NOISY_VERDICT: ${{ steps.noisy.outputs.verdict }}
          NOISY_PASSED: ${{ steps.noisy.outputs.passed }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          REGRESSION_VERDICT: ${{ steps.regression.outputs.verdict }}
        run: |
          set -eu
          test "$NOISY_VERDICT" = "inconclusive"
          test "$NOISY_PASSED" = "true"
          test "$REGRESSION_OUTCOME" = "failure"
          test "$REGRESSION_VERDICT" = "regression"
          echo "action behaves as specified"
